<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f58a4b" stop-opacity="0.34" />
      <stop offset="0.55" stop-color="#b8400f" stop-opacity="0.10" />
      <stop offset="1" stop-color="#0b0c0e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0c0e" />
  <path d="M700 0 L1200 0 L1200 630 L520 630 Z" fill="url(#sweep)" />
  <g stroke="#1d2026" stroke-width="1">
    <path d="M0 505h1200" />
  </g>

  <rect x="80" y="86" width="44" height="3" fill="#f58a4b" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
    <text x="80" y="132" fill="#f58a4b" letter-spacing="1.5">GPUIX</text>
    <text x="158" y="132" fill="#757a83">中文文档</text>
  </g>

  <text x="80" y="268" fill="#f4f4f5" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="78" font-weight="700" letter-spacing="-2.4">React 的写法，</text>
  <text x="80" y="362" fill="#f58a4b" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="78" font-weight="700" letter-spacing="-2.4">GPU 的渲染管线</text>

  <text x="80" y="428" fill="#9498a0" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="27">用 TypeScript 写组件树，由 Metal、DirectX 或 Vulkan 画出来。</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">
    <rect x="80" y="520" width="392" height="56" rx="6" fill="#121317" stroke="#25282e" />
    <text x="102" y="555" fill="#f58a4b">$</text>
    <text x="122" y="555" fill="#d8dade">bunx @gpuix/cli new my-app</text>

    <rect x="488" y="520" width="236" height="56" rx="6" fill="#121317" stroke="#25282e" />
    <text x="510" y="555" fill="#f58a4b">$</text>
    <text x="530" y="555" fill="#d8dade">bun run dev</text>
  </g>

  <text x="1120" y="553" text-anchor="end" fill="#757a83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">gpuix.ndjp.net</text>
</svg>
